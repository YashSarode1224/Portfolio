<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function() {
            var savedTheme = localStorage.getItem('yash_portfolio_theme');
            if (savedTheme === 'sketch') {
                document.documentElement.setAttribute('data-theme', 'sketch');
            }
        })();
    </script>
    
    <!-- SECURITY HEADERS -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://via.placeholder.com; connect-src 'self';">

    <!-- FAVICON -->
    <link rel="icon" href="favicon.png">
    <title>Yash Sarode</title>
    
    <!-- SECURE SCRIPT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" 
            xintegrity="sha512-dLxUelApnYxpLt6K2qm55wo5OGowFrkMCa/ASCyYiUc1ztX8GT09S/m89B+cCvbraX2jP9c2Q14MA96dS7oBdA==" 
            crossorigin="anonymous" 
            referrerpolicy="no-referrer"></script>
            
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.3">
</head>
<body>

    <div id="canvas-container"></div>

    <!-- SKETCH MODE ONLY: Full-Page Interactive Blue Ink Doodle Canvas ("CURSOR IS INK") -->
    <canvas id="inkCanvas" class="ink-canvas sketch-only" aria-hidden="true"></canvas>

    <!-- SKETCH MODE ONLY: Floating Doodle & Erase Control Bar in Bottom Right -->
    <div class="floating-doodle-bar sketch-only" id="floatingDoodleBar" role="toolbar" aria-label="Doodle Controls">
        <button class="doodle-tool-btn" id="doodlePenBtn" type="button" title="Doodle Pen: Drag mouse or finger to draw blue ink on paper">
            <span class="tool-icon">✏️</span>
            <span class="tool-label">doodle</span>
        </button>
        <button class="doodle-tool-btn" id="doodleEraseBtn" type="button" title="Erase blue ink scribbles">
            <span class="tool-icon">⌫</span>
            <span class="tool-label">erase</span>
        </button>
    </div>

    <main>
        <nav>
            <div class="logo">
                <span class="brutalist-only">Portfolio</span>
                <span class="logo-sketch sketch-only">
                    yash
                    <svg class="sketch-underline" viewBox="0 0 50 12" fill="none" aria-hidden="true"><path d="M2 9 C15 3, 30 11, 48 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
                </span>
            </div>
            <div class="nav-right">
                <button class="theme-toggle-btn" id="theme-toggle-btn" type="button" title="Switch Theme (Brutalist ↔ Hand-Drawn Sketch)">
                    <span class="theme-toggle-icon">✏️</span>
                    <span class="theme-toggle-label">Sketch Mode</span>
                </button>
                <div class="social-links">
                    <a href="projects.html">← Back to Projects</a>
                </div>
            </div>
        </nav>

        <section class="project-details-container">
            
            <!-- Left: Slider -->
            <div class="project-showcase">
                <div class="slider-container">
                    <div class="slider-track" id="sliderTrack">
                        <!-- SKELETON INJECTED HERE BY JS -->
                    </div>
                    <button class="slider-btn prev-btn" id="prevBtn">❮</button>
                    <button class="slider-btn next-btn" id="nextBtn">❯</button>
                    <div class="slider-dots" id="sliderDots"></div>
                </div>
            </div>

            <!-- Right: Details -->
            <div class="about-text">
                <h2 id="project-title">
                    <!-- SKELETON INJECTED HERE -->
                </h2>
                
                <div class="skills-wrapper" id="project-tech" style="margin-bottom: 20px;">
                    <!-- SKELETON INJECTED HERE -->
                </div>

                <div id="dynamic-content" class="description-section">
                    <h3 id="slide-title"></h3>
                    <p id="slide-desc"></p>
                </div>
                
                <div class="info-card" style="margin-top: 30px;">
                    <h3>Project Overview</h3>
                    <p id="project-full-desc" style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.6;">
                        <!-- SKELETON INJECTED HERE -->
                    </p>
                </div>

                <br>
                <div class="btn-group">
                    <!-- SECURE LINKS -->
                    <a href="#" id="live-link" class="visit-btn" target="_blank" rel="noopener noreferrer">View Live</a>
                    <a href="#" id="repo-link" class="visit-btn visit-btn--secondary" target="_blank" rel="noopener noreferrer">GitHub</a>
                </div>
            </div>
        </section>
    </main>
    
    <script src="script.js?v=3.2"></script>
</body>
</html>
